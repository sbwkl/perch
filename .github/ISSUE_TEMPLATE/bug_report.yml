name: Bug report
description: 报告可复现的问题（请勿粘贴真实会话标题、路径或数据库内容）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先查看 [FAQ](https://github.com/sbwkl/perch/blob/main/docs/FAQ.md)。
        安全漏洞请不要公开提交，改用 [SECURITY.md](https://github.com/sbwkl/perch/blob/main/SECURITY.md) 的私密渠道。

  - type: input
    id: version
    attributes:
      label: Perch 版本或 commit
      description: 例如 0.1.0 或 git commit hash
      placeholder: 0.1.0 / abc1234
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "14.6 / 15.0"
    validations:
      required: true

  - type: checkboxes
    id: sources
    attributes:
      label: 受影响的来源
      options:
        - label: Qoder
        - label: Claude Code
        - label: Codex
        - label: OpenCode
        - label: Kilo
        - label: 界面 / 其他

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 Perch
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（已脱敏）
      description: 请删除会话标题、项目路径、用户名、数据库内容等个人信息。
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实会话标题、项目路径、凭据和数据库内容
          required: true
