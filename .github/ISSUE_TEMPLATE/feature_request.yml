name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Perch 的硬约束是只读源数据。请说明建议是否涉及写入 agent 数据；
        涉及回写的能力需要独立开关和明确确认流程。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在的使用场景是什么？哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 可以描述交互、数据来源和预期结果。
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 新增或修改采集器（只读）
        - label: 界面 / 交互
        - label: 覆盖层 / 用户数据（如置顶、标签）
        - label: 需要回写 agent（需额外评审）
        - label: 文档 / 工程化

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
